name: API continuous integration

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  run-tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: flowboard_test
          POSTGRES_PASSWORD: flowboard_pass
          POSTGRES_DB: flowboard_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://flowboard_test:flowboard_pass@localhost:5432/flowboard_test_db?schema=public"
      DIRECT_URL: "postgresql://flowboard_test:flowboard_pass@localhost:5432/flowboard_test_db?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Set up node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.0
          cache: "npm"

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test